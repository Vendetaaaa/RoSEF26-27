name: Tests

on:
  push:
    branches:
      - main
      - "dev/**"

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify LLL backend
        run: |
          python -c "from fpylll import IntegerMatrix, LLL; print('fpylll import: PASS')"

      - name: Verify oracle HNP key recovery
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python informatica/ECDSA/dataset_generator3.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('informatica/ECDSA').resolve()))
          import main

          result = main.validate_shared_hnp_instance(require_fpylll=True)
          assert result.get('relation_ok') is True, 'Oracle HNP relation failed.'
          assert result.get('key_recovered') is True, 'Oracle HNP key recovery failed.'
          assert result.get('backend') == 'fpylll', 'Oracle HNP did not use fpylll.'
          assert result.get('reduction_error') is None, result.get('reduction_error')
          print('Oracle HNP key recovery: PASS (independent of CNN experiment)')
          PY
          
      - name: Restore tracked files after runtime verification
        run: |
          git checkout -- .

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -v
