name: Core tests

on:
  push:
    paths:
      - '**/*.py'
      - '*.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'setup.cfg'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - '**/*.py'
      - '*.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'setup.cfg'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system libraries for lattice dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check core Python syntax
        run: |
          python -m compileall -q informatica/ECDSA informatica/cnn

      - name: Run core tests only
        run: >-
          python -m pytest -v
          tests/test_ecdsa.py
          tests/test_hnp.py
          tests/test_hnp_regressions.py
          tests/test_benchmark_hnp_surface.py
          tests/test_independent_verification.py
          tests/test_math.py
          tests/test_model.py
          tests/test_simulator.py
          tests/test_smoke.py
