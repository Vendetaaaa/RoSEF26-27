name: Quick Parameter Benchmark (12 seeds; exploratory)

on:
  workflow_dispatch:

jobs:
  sweep:
    name: Exploratory CNN + HNP sweep (12 seeds)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify fpylll
        run: python -c "from fpylll import IntegerMatrix, LLL; print('fpylll import: PASS')"

      - name: Run parameter sweep
        env:
          PYTHONPATH: ${{ github.workspace }}/informatica/ECDSA:${{ github.workspace }}/informatica/cnn
        run: |
          python informatica/experiments/benchmark_cnn_hnp_surface.py \
            --leakage-mode HW \
            --leaked-bits 8 10 12 14 \
            --sigmas 0.10 0.15 0.20 0.25 \
            --sample-counts 20 40 \
            --seeds 20260919 20260920 20260921 20260922 20260923 20260924 20260925 20260926 20260927 20260928 20260929 20260930 \
            --epochs 160

      - name: Upload benchmark table
        uses: actions/upload-artifact@v4
        with:
          name: cnn-hnp-quick-sweep-12-seeds
          path: |
            results/synthetic/HW/tables/cnn-hnp-parameter-sweep.csv
            results/synthetic/HW/tables/cnn-hnp-parameter-sweep-summary.csv
