name: Reproducibility Check

on:
  workflow_dispatch:

jobs:
  reproduce:
    name: Reproducibility check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify fpylll and complete pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "from fpylll import IntegerMatrix, LLL; print('fpylll import: PASS')"
          python informatica/ECDSA/main.py --require-fpylll
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          pipeline = json.loads((root / 'informatica/artifacts/pipeline_results.json').read_text(encoding='utf-8'))
          hnp = json.loads((root / 'informatica/artifacts/hnp_result.json').read_text(encoding='utf-8'))
          assert pipeline['fully_executed'] is True
          assert pipeline['hnp'] == 'PASS'
          assert pipeline['hnp_backend'] == 'fpylll'
          assert hnp['reduction_backend'] == 'fpylll'
          assert hnp['validated'] is True
          assert hnp['key_recovered'] is True
          print('Reference pipeline: PASS')
          PY

      - name: Run reproducibility tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -v tests/
